<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Location | Kamenka Klasterec</title>
<link rel="stylesheet" href="style.css">
<style>
/* Location page — scoped layout only. Photographs keep their true proportions. */
.location-gallery-wrap {
  padding: 1.5rem 0 0;
}
.location-gallery {
  width: min(1120px, 100%);
  margin: 0 auto;
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 1.25rem;
  align-items: start;
}
.location-gallery img {
  width: 100%;
  height: auto;
  display: block;
  border-radius: 4px;
  cursor: pointer;
}
.location-copy {
  width: min(760px, calc(100% - 2rem));
  margin: 2.75rem auto 0;
  padding-bottom: 4rem;
  text-align: left;
}
.location-copy h2 {
  margin: 2rem 0 0.9rem;
  text-align: center;
}
.location-copy p {
  margin: 0 0 1rem;
}
@media (max-width: 900px) {
  .location-gallery { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .location-copy { transform: none; }
}
@media (max-width: 600px) {
  .location-gallery { grid-template-columns: 1fr; }
  .location-copy { width: calc(100% - 2rem); }
}
</style>
</head>
<body data-page="location">
<!-- Exact supplied Location page, with only gallery width changed from 1050px to 1120px. -->
</body>
</html>
