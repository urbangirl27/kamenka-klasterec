<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact | [Property Name]</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site">
  <div class="wrap">
    <span class="logo">[Property Name]</span>
    <nav class="main">
      <a href="index.html">Home</a>
      <a href="about.html">About Us</a>
      <a href="location.html">Location</a>
      <a href="contact.html" class="active">Contact</a>
    </nav>
  </div>
</header>

<section class="hero">
  <div class="wrap">
    <p class="eyebrow">Get in touch</p>
    <h1>Plan your stay</h1>
    <p class="lead">[Client's note — how quickly they respond, best way to reach them.]</p>
  </div>
</section>

<section style="padding: 3rem 0 5rem;">
  <div class="wrap" style="max-width: 480px;">
    <form>
      <div style="margin-bottom: 1.2rem;">
        <label style="display:block; font-size:0.9rem; margin-bottom:0.4rem; color:var(--heading);">Name</label>
        <input type="text" style="width:100%; padding:0.7rem; border:1px solid var(--border); border-radius:4px; background:var(--cream-deep); font-family:inherit;">
      </div>
      <div style="margin-bottom: 1.2rem;">
        <label style="display:block; font-size:0.9rem; margin-bottom:0.4rem; color:var(--heading);">Email</label>
        <input type="email" style="width:100%; padding:0.7rem; border:1px solid var(--border); border-radius:4px; background:var(--cream-deep); font-family:inherit;">
      </div>
      <div style="margin-bottom: 1.2rem;">
        <label style="display:block; font-size:0.9rem; margin-bottom:0.4rem; color:var(--heading);">Dates you're interested in</label>
        <input type="text" style="width:100%; padding:0.7rem; border:1px solid var(--border); border-radius:4px; background:var(--cream-deep); font-family:inherit;">
      </div>
      <div style="margin-bottom: 1.2rem;">
        <label style="display:block; font-size:0.9rem; margin-bottom:0.4rem; color:var(--heading);">Message</label>
        <textarea rows="4" style="width:100%; padding:0.7rem; border:1px solid var(--border); border-radius:4px; background:var(--cream-deep); font-family:inherit;"></textarea>
      </div>
      <button type="submit" class="btn" style="border:none; cursor:pointer;">Send enquiry</button>
    </form>
    <div class="placeholder-text" style="margin-top:2rem;">Placeholder — form is not yet connected to send anywhere. Needs an email service or form handler once hosting is set up.</div>
  </div>
</section>

<footer class="site">
  <div class="wrap">
    &copy; [Property Name] — [Location]
  </div>
</footer>

</body>
</html>
