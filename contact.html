<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact | Kamenka Klasterec</title>
<link rel="stylesheet" href="style.css">
</head>
<body data-page="contact">
<header class="site">
  <div class="wrap">
    <span class="logo">Kamenka Klasterec</span>
    <nav class="main">
      <a href="index.html" data-i18n="navHome">Home</a>
      <a href="about.html" data-i18n="navAbout">About Us</a>
      <a href="location.html" data-i18n="navLocation">Location</a>
      <a href="contact.html" class="active" data-i18n="navContact">Contact</a>
    </nav>
  </div>
</header>
<section class="hero">
  <div class="wrap">
    <p class="eyebrow" data-i18n="contactEyebrow">Get in touch</p>
    <h1 data-i18n="contactTitle">Plan your stay</h1>
    <p class="lead" data-i18n="contactLead">[Ivan's note — how quickly they respond, best way to reach them.]</p>
    <p class="lead" style="margin-top:0.6rem;" data-i18n-email-line></p>
  </div>
</section>
<section style="padding: 3rem 0 5rem;">
  <div class="wrap" style="max-width: 480px;">
    <form action="https://formspree.io/f/xqpakgak" method="POST">
      <div style="margin-bottom: 1.2rem;">
        <label style="display:block; font-size:0.9rem; margin-bottom:0.4rem; color:var(--heading);" data-i18n="nameLabel">
          Name
        </label>
        <input type="text" name="name" style="width:100%; padding:0.7rem; border:1px solid var(--border); border-radius:4px; background:var(--cream-deep); font-family:inherit;">
      </div>
      <div style="margin-bottom: 1.2rem;">
        <label style="display:block; font-size:0.9rem; margin-bottom:0.4rem; color:var(--heading);" data-i18n="emailLabel">
          Email
        </label>
        <input type="email" name="email" style="width:100%; padding:0.7rem; border:1px solid var(--border); border-radius:4px; background:var(--cream-deep); font-family:inherit;">
      </div>
      <div style="margin-bottom: 1.2rem;">
        <label style="display:block; font-size:0.9rem; margin-bottom:0.4rem; color:var(--heading);" data-i18n="datesLabel">
          Dates you are interested in
        </label>
        <input type="text" name="dates" style="width:100%; padding:0.7rem; border:1px solid var(--border); border-radius:4px; background:var(--cream-deep); font-family:inherit;">
      </div>
      <div style="margin-bottom: 1.2rem;">
        <label style="display:block; font-size:0.9rem; margin-bottom:0.4rem; color:var(--heading);" data-i18n="messageLabel">
          Message
        </label>
        <textarea name="message" rows="4" style="width:100%; padding:0.7rem; border:1px solid var(--border); border-radius:4px; background:var(--cream-deep); font-family:inherit;"></textarea>
      </div>
      <button type="submit" class="btn" style="border:none; cursor:pointer;" data-i18n="sendButton">Send enquiry</button>
    </form>
  </div>
</section>
<footer class="site">
  <div class="wrap">
    &copy; Kamenka Klasterec — Chomutovská 209, Klášterec nad Ohří, 431 51, (Za nakládací rampou TESCA)
  </div>
</footer>
<script src="language.js"></script>
</body>
</html>
